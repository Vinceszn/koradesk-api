# Separate project/database, with no production data volume or application credentials.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: foundation
      POSTGRES_PASSWORD: foundation
      POSTGRES_DB: koradesk_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foundation -d koradesk_test"]
      interval: 2s
      timeout: 3s
      retries: 20
