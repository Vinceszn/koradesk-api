<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kora Ops — {% block title %}dashboard{% endblock %}</title>
<style>
:root{
  --ink:#0b1210; --paper:#ffffff; --surface:#f5f5f3; --sand:#e6e7e3;
  --muted:#6d726f; --accent:#0f7a5b; --accent-deep:#0a5a43; --accent-soft:#d3f3e4;
  --clay:#d92d20; --warning:#b45309; --faint:#9ca3a0;
  --shadow:0 1px 2px rgb(17 20 19/.06),0 24px 48px -24px rgb(17 20 19/.22);
}
*{box-sizing:border-box}
body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:var(--paper);color:var(--ink);max-width:1100px;margin:0 auto;
  padding:0 20px 64px;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{letter-spacing:-.02em;line-height:1.15;margin:0 0 .5rem}
h1{font-size:2rem;font-weight:700;letter-spacing:-.03em}
a{color:var(--accent)}
.topbar{display:flex;align-items:center;gap:6px;padding:16px 0;border-bottom:1px solid var(--sand);margin-bottom:28px}
.brand{font-weight:700;font-size:1.1rem;color:var(--ink);text-decoration:none;margin-right:20px}
.brand span{color:var(--accent)}
.topbar nav{display:flex;gap:4px}
.topbar nav a{text-decoration:none;color:var(--muted);font-weight:600;font-size:.9rem;
  padding:.45rem .9rem;border-radius:999px}
.topbar nav a:hover{background:var(--surface);color:var(--ink)}
.actor{margin-left:auto;font-size:.8rem;color:var(--faint)}
.eyebrow{font-size:.75rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted);font-size:.85rem}
.card{background:#fff;border:1px solid var(--sand);border-radius:1rem;
  padding:20px 22px;margin:16px 0;box-shadow:var(--shadow)}
.card h3{font-size:1.15rem;margin-bottom:.75rem}
table{border-collapse:collapse;width:100%;margin-top:12px;font-size:.92rem;
  background:#fff;border:1px solid var(--sand);border-radius:1rem;overflow:hidden}
th,td{padding:.65rem .8rem;text-align:left;border-bottom:1px solid var(--sand)}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:var(--surface)}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafafa}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:2.5rem;
  padding:.5rem 1.2rem;border-radius:999px;border:1px solid transparent;
  font-size:.875rem;font-weight:600;cursor:pointer;text-decoration:none;
  background:var(--ink);color:#fff}
.btn:hover{background:var(--accent)}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--sand)}
.btn-ghost:hover{border-color:var(--ink);background:var(--surface)}
.btn-danger{background:transparent;color:var(--clay);border-color:var(--sand)}
.btn-danger:hover{border-color:var(--clay);background:#fef2f2}
input,select,textarea{font-size:.92rem;padding:.5rem .75rem;margin:2px;
  border-radius:.5rem;border:1px solid var(--sand);background:#fff;color:var(--ink);font-family:inherit}
input::placeholder,textarea::placeholder{color:var(--faint)}
form.inline{display:inline}
.pill{display:inline-block;font-size:.75rem;font-weight:700;padding:.15rem .65rem;border-radius:999px}
.pill.green{background:var(--accent-soft);color:var(--accent-deep)}
.pill.amber{background:#fef3c7;color:var(--warning)}
.pill.red{background:#fee2e2;color:var(--clay)}
.pill.grey{background:var(--surface);color:var(--muted)}
.bar{display:inline-block;background:var(--surface);border:1px solid var(--sand);
  width:100px;height:10px;border-radius:999px;vertical-align:middle;overflow:hidden}
.bar>i{display:block;background:var(--accent);height:100%;border-radius:999px}
.bar.hot>i{background:var(--clay)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="topbar">
<a class="brand" href="/admin/shops">Kora<span>&nbsp;Ops</span></a>
<nav>
<a href="/admin/shops">Shops</a><a href="/admin/approvals?status=pending">Approvals</a><a href="/admin/leads">Leads</a><a href="/admin/costs">Costs</a>
</nav>
<span class="actor">{{ actor }}</span>
</div>
{% block body %}{% endblock %}
</body>
</html>
