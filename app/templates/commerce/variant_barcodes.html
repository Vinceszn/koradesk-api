<section class="panel manage-form"><h2>Barcodes</h2><p class="hint">Leading zeroes are preserved. Alternate supplier codes can identify the same variant.</p>
{% for barcode in barcodes %}<form method="post" action="/app/{{ merchant.id }}/pos/barcodes/{{ barcode.id }}/archive"><input type="hidden" name="csrf" value="{{ csrf }}"><p>{{ barcode.code }} · {{ barcode.symbology }}{% if barcode.is_primary %} · Primary{% endif %}</p><button class="button secondary">Remove barcode</button></form>{% else %}<p class="hint">No active barcodes assigned.</p>{% endfor %}
<form method="post" action="/app/{{ merchant.id }}/pos/barcodes"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="variant_id" value="{{ variant.id }}"><label>Barcode<input name="code" maxlength="128" required></label><label>Format<select name="symbology">{% for format in ['unknown','ean8','ean13','upca','gtin14','code128'] %}<option>{{ format }}</option>{% endfor %}</select></label><label><input type="checkbox" name="primary" value="yes"> Make primary</label><button class="button">Assign barcode</button></form></section>
