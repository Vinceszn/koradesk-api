name: Engineering foundation

on:
  push:
    branches: [main, engineering-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  ENV: dev

jobs:
  quality:
    name: Ruff and lock consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install uv==0.8.16
      - name: Install locked environment
        run: |
          uv venv
          uv pip sync --require-hashes requirements-dev.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: ruff check .
      - run: ruff format --check .
      - name: Check generated dependency locks
        run: |
          uv pip compile requirements.in --python-version 3.13 --universal --generate-hashes --no-header -o requirements.txt
          uv pip compile requirements-dev.in --python-version 3.13 --universal --generate-hashes --no-header -o requirements-dev.txt
          git diff --exit-code -- requirements.txt requirements-dev.txt

  tests:
    name: SQLite and configuration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install uv==0.8.16
      - name: Install locked environment
        run: |
          uv venv
          uv pip sync --require-hashes requirements-dev.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: python -m pytest -q -m "not postgres"

  postgres:
    name: PostgreSQL ${{ matrix.postgres }} integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: foundation
          POSTGRES_PASSWORD: foundation
          POSTGRES_DB: koradesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foundation -d koradesk_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://foundation:foundation@127.0.0.1:5432/koradesk_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install uv==0.8.16
      - name: Install locked environment
        run: |
          uv venv
          uv pip sync --require-hashes requirements-dev.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: python -m pytest -q -m postgres --require-postgres

  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install uv==0.8.16
      - name: Install locked environment
        run: |
          uv venv
          uv pip sync --require-hashes requirements-dev.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Audit complete runtime and development dependency set
        run: python -m pip_audit -r requirements-dev.txt --require-hashes --disable-pip --progress-spinner off
